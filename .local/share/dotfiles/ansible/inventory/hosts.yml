# Static inventory skeleton. VM aliases are NOT listed here —
# `update_vm_openssh` discovers them via DHCP leases and writes
# inventory/vms.yml (gitignored) grouped by hypervisor short name
# (kl1, kl2, ...). Ansible merges both files because ansible.cfg points
# at the inventory/ directory.
#
# Add long-lived non-VM hosts (bare metal) below.

all:
  children:
    vms:
      # Children (kl1, kl2, ...) and their hosts come from vms.yml.
      # This parent group exists so playbooks can target `-l vms` even
      # before the first `update_vm_openssh` run produces vms.yml.
      children: {}
    bare_metal:
      hosts: {}
        # myserver:
