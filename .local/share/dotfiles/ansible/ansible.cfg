[defaults]
inventory = inventory/
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False
forks = 10

[ssh_connection]
# Rely on the user's ~/.ssh/config for ProxyJump/HostName/User entries.
# `update_vm_openssh` writes VM aliases (with ProxyJump through the
# hypervisor) into ~/.config/ssh/vm.conf, so ensure ~/.ssh/config has:
#     Include ~/.config/ssh/*.conf
# Then a bare `ansible-playbook ... -l opencode.kl2` resolves the alias.
# `update_vm_openssh` also writes inventory/vms.yml (gitignored) holding
# the discovered VM aliases grouped by hypervisor; static hosts/groups
# stay in inventory/hosts.yml.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
